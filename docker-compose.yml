services:
  mysql:
    image: mysql:8.4
    container_name: hummingtone-mysql
    environment:
      MYSQL_ROOT_PASSWORD: GCN@6677
      MYSQL_DATABASE: hummingtone
      MYSQL_USER: hummingtone
      MYSQL_PASSWORD: GCN@6677
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - hummingtone_net

  backend:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: hummingtone-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: GCN@6677
      DB_NAME: ${DB_NAME}
    ports:
      - "5000:5000"
    volumes:
      - ./Server:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - hummingtone_net

  frontend:
    build:
      context: ./Humming_Tone
      dockerfile: Dockerfile
    container_name: hummingtone-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    ports:
      - "5173:5173"
    volumes:
      - ./Humming_Tone:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - hummingtone_net

volumes:
  mysql_data:

networks:
  hummingtone_net:
    driver: bridge
